<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos queridos hermanos</title>
  <style>
    :root {
      /* Fondo más neutro - azul grisáceo suave */
      --bg-primary: linear-gradient(135deg, #5a6c7d 0%, #4a5568 100%);
      --text-primary: #ffffff;
      --text-glow: rgba(255, 255, 255, 0.6);
      --sparkle-color: #ffd93d;
      --shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    @media (prefers-color-scheme: dark) {
      :root.dark-auto {
        --bg-primary: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      }
    }

    .dark-mode {
      --bg-primary: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Partículas flotantes de fondo */
    .particles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: var(--text-glow);
      border-radius: 50%;
      opacity: 0.6;
      animation: float 15s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-100px) rotate(720deg);
        opacity: 0;
      }
    }

    /* Contenedor principal */
    .welcome-container {
      text-align: center;
      padding: 40px;
      max-width: 1200px;
      animation: fadeInUp 1.2s ease;
      position: relative;
      z-index: 10;
    }

    /* Contenedor de logos - POSICIONADOS EN ESQUINA */
    .logos-container {
      position: absolute;
      top: 30px;
      left: 30px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 20;
    }

    .logo-item {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-width: 120px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.85;
      overflow: hidden;
    }

    .logo-item:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      opacity: 1;
    }

    .logo-item img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Texto principal */
    .welcome-text {
      font-size: clamp(3rem, 10vw, 7rem);
      font-weight: 900;
      line-height: 1.1;
      text-shadow: 0 8px 32px rgba(0,0,0,0.4);
      background: linear-gradient(135deg, #fff 0%, #f8f8f8 50%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: textGlow 3s ease-in-out infinite alternate;
      letter-spacing: 3px;
      margin: 20px 0;
    }

    @keyframes textGlow {
      from {
        filter: drop-shadow(0 0 15px var(--text-glow));
      }
      to {
        filter: drop-shadow(0 0 35px var(--text-glow));
      }
    }

    /* Subtítulo */
    .welcome-subtitle {
      font-size: clamp(1.3rem, 3.5vw, 2rem);
      margin-top: 30px;
      opacity: 0.95;
      font-weight: 400;
      letter-spacing: 6px;
      text-transform: uppercase;
      animation: fadeIn 2s ease 0.5s both;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    /* Footer con fecha y lugar */
    .footer-info {
      margin-top: 40px;
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      opacity: 0.85;
      font-weight: 300;
      letter-spacing: 1px;
      animation: fadeIn 2s ease 1s both;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Toggle de tema */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
      z-index: 1000;
      font-size: 1.5rem;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.3);
      transform: rotate(180deg) scale(1.1);
    }

    /* BOTÓN DE PANTALLA COMPLETA */
    .fullscreen-toggle {
      position: fixed;
      top: 80px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
      z-index: 1000;
      font-size: 1.3rem;
    }

    .fullscreen-toggle:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }

    .fullscreen-toggle.active {
      background: rgba(255, 215, 0, 0.3);
      border-color: #ffd700;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .logos-container {
        top: 20px;
        left: 20px;
        gap: 10px;
      }
      
      .logo-item {
        min-width: 90px;
        height: 50px;
        padding: 8px 12px;
      }
      
      .welcome-container {
        padding: 20px 15px;
      }
      
      .theme-toggle,
      .fullscreen-toggle {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }

      .fullscreen-toggle {
        top: 70px;
      }
    }

    @media (max-width: 480px) {
      .logo-item {
        min-width: 70px;
        height: 40px;
      }
    }

    .welcome-container:hover .welcome-text {
      animation: textGlow 1.5s ease-in-out infinite alternate;
    }
  </style>
</head>
<body id="body">
  <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo claro/oscuro" title="Cambiar tema">🌓</button>
  <button class="fullscreen-toggle" id="fullscreenToggle" aria-label="Pantalla completa" title="Pantalla completa (F11)">⛶</button>

  <div class="particles" id="particles"></div>

  <!-- Logo en la esquina superior izquierda -->
  <div class="logos-container">
    <div class="logo-item">
      <img src="general/logo.jpeg" alt="Altos del Raco">
    </div>
  </div>

  <div class="welcome-container">
    <h1 class="welcome-text">Bienvenidos queridos hermanos</h1>
    <p class="welcome-subtitle">Coordinación Conmemoración</p>
    <p class="footer-info">Jueves 2 de abril de 2026 - Salón de asambleas Puente Alto</p>
  </div>

  <script>
    function createParticles() {
      const container = document.getElementById('particles');
      const particleCount = 25;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (15 + Math.random() * 10) + 's';
        particle.style.width = particle.style.height = (4 + Math.random() * 8) + 'px';
        container.appendChild(particle);
      }
    }

    // Modo oscuro/claro
    const body = document.getElementById('body');
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme-welcome');

    function setTheme(theme) {
      if (theme === 'dark') {
        body.classList.remove('dark-auto');
        body.classList.add('dark-mode');
        localStorage.setItem('theme-welcome', 'dark');
      } else {
        body.classList.remove('dark-mode', 'dark-auto');
        localStorage.setItem('theme-welcome', 'light');
      }
    }

    if (savedTheme === 'dark') setTheme('dark');
    else if (savedTheme === 'light') setTheme('light');

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('dark-mode') || body.classList.contains('dark-auto')) {
        setTheme('light');
        themeToggle.innerHTML = '🌓';
      } else {
        setTheme('dark');
        themeToggle.innerHTML = '☀️';
      }
    });

    // PANTALLA COMPLETA
    const fullscreenToggle = document.getElementById('fullscreenToggle');
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenToggle.classList.add('active');
          fullscreenToggle.innerHTML = '⛶';
        }).catch(err => {
          console.log('Error al activar pantalla completa:', err);
        });
      } else {
        document.exitFullscreen().then(() => {
          fullscreenToggle.classList.remove('active');
          fullscreenToggle.innerHTML = '⛶';
        });
      }
    }

    fullscreenToggle.addEventListener('click', toggleFullscreen);

    // También con tecla F11
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Detectar cambios de pantalla completa
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fullscreenToggle.classList.add('active');
      } else {
        fullscreenToggle.classList.remove('active');
      }
    });

    // Inicializar
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
    });
  </script>
</body>
</html>
