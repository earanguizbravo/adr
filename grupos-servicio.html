<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privilegios Grupos de Servicio - Altos del Raco</title>
  <style>
    :root {
      --bg-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.98);
      --text-primary: #2c3e50;
      --text-secondary: #555;
      --accent: #667eea;
      --accent-secondary: #764ba2;
      --shadow: 0 10px 40px rgba(0,0,0,0.2);
      --number-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --number-text: #fff;
      --border-radius: 20px;
    }

    @media (prefers-color-scheme: dark) {
      :root.dark-auto {
        --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        --card-bg: rgba(45, 45, 45, 0.98);
        --text-primary: #e0e0e0;
        --text-secondary: #bbbbbb;
        --number-bg: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
      }
    }

    .dark-mode {
      --bg-primary: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --card-bg: rgba(45, 45, 45, 0.98);
      --text-primary: #e0e0e0;
      --text-secondary: #bbbbbb;
      --number-bg: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      min-height: 100vh;
      color: var(--text-primary);
      overflow-x: hidden;
      transition: all 0.3s ease;
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      margin-bottom: 30px;
      animation: fadeInDown 0.8s ease;
    }

    .header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      border-radius: 50px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: var(--shadow);
    }

    .logo {
      height: 60px;
      width: auto;
      border-radius: 15px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    .header-separator {
      width: 2px;
      height: 40px;
      background: rgba(255,255,255,0.5);
      border-radius: 2px;
    }

    .header-subtitle {
      font-size: clamp(1.2rem, 2.5vw, 1.6rem);
      color: rgba(255,255,255,0.95);
      font-weight: 600;
      white-space: nowrap;
    }

    .header-date {
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      color: rgba(255,255,255,0.9);
      font-weight: 500;
      white-space: nowrap;
    }

    .main-content {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 50px;
      flex: 1;
      align-items: stretch;
    }

    .service-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 40px;
      box-shadow: var(--shadow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeInUp 0.8s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .service-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--number-bg);
    }

    .service-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .service-card.today {
      border: 5px solid #ffd700;
      animation: pulse-card 2s infinite;
    }

    @keyframes pulse-card {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
      50% { box-shadow: 0 0 0 25px rgba(255, 215, 0, 0); }
    }

    .card-icon {
      font-size: 5rem;
      margin-bottom: 15px;
      text-align: center;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
    }

    .card-title {
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      text-align: center;
      margin-bottom: 25px;
      color: var(--text-primary);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .group-container {
      position: relative;
      margin: 20px 0;
    }

    .group-number {
      background: var(--number-bg);
      color: var(--number-text);
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8rem;
      font-weight: bold;
      box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
      animation: pulse 2s infinite;
      border: 6px solid rgba(255,255,255,0.3);
      text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.7);
      }
    }

    .today-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #ffd700;
      color: #2c3e50;
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
      z-index: 1000;
      font-size: 1.5rem;
    }

    .theme-toggle:hover {
      background: rgba(255,255,255,0.3);
      transform: rotate(180deg) scale(1.1);
    }

    .fullscreen-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255,255,255,0.3);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
      z-index: 1000;
      font-size: 1.3rem;
      opacity: 0.6;
    }

    .fullscreen-toggle:hover {
      background: rgba(255,255,255,0.25);
      opacity: 1;
      transform: scale(1.1);
    }

    .fullscreen-toggle.active {
      background: rgba(255, 215, 0, 0.3);
      border-color: #ffd700;
      opacity: 1;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1100px) {
      .main-content {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      
      .group-number {
        width: 180px;
        height: 180px;
        font-size: 6rem;
      }

      .header-bar {
        flex-direction: column;
        gap: 15px;
        padding: 20px 30px;
        border-radius: 30px;
      }

      .header-separator {
        width: 40px;
        height: 2px;
      }

      .logo {
        height: 50px;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px 15px;
      }
      
      .service-card {
        padding: 30px 20px;
      }
      
      .group-number {
        width: 150px;
        height: 150px;
        font-size: 5rem;
      }
      
      .card-icon {
        font-size: 3.5rem;
      }
      
      .card-title {
        font-size: 1.3rem;
      }

      .header-bar {
        padding: 15px 20px;
      }

      .header-subtitle {
        font-size: 1.1rem;
      }

      .header-date {
        font-size: 0.85rem;
      }

      .logo {
        height: 40px;
      }

      .fullscreen-toggle {
        width: 40px;
        height: 40px;
        font-size: 1.1rem;
      }
    }

    @media screen and (min-width: 1920px) {
      .service-card {
        padding: 60px 50px;
      }
      
      .group-number {
        width: 280px;
        height: 280px;
        font-size: 10rem;
      }
      
      .card-icon {
        font-size: 6rem;
      }

      .logo {
        height: 70px;
      }
    }
  </style>
</head>
<body id="body">
  <button class="theme-toggle" id="themeToggle" aria-label="Alternar modo claro/oscuro" title="Cambiar tema">🌓</button>
  <button class="fullscreen-toggle" id="fullscreenToggle" aria-label="Pantalla completa" title="Pantalla completa (F11)">⛶</button>

  <div class="container">
    <div class="header">
      <div class="header-bar">
        <img src="general/logo.jpeg" alt="Logo Altos del Raco" class="logo">
        <div class="header-separator"></div>
        <div class="header-subtitle">Privilegios Grupos de Servicio</div>
        <div class="header-separator"></div>
        <div class="header-date" id="currentDate">
          <!-- Fecha se actualiza con JS -->
        </div>
      </div>
    </div>

    <div class="main-content" id="mainContent">
      <!-- El contenido se genera dinámicamente -->
    </div>
  </div>

  <script>
    // Configuración basada en la tabla proporcionada
    // Martes 24 de febrero 2026: Grupo 3 Limpieza
    // Sábado 21 de febrero 2026: Grupo 2 Hospitalidad
    
    const baseDate = new Date('2026-02-24'); // Martes base
    const baseCleaningGroup = 3; // Grupo 3 el martes 24
    const baseSaturday = new Date('2026-02-21'); // Sábado base
    const baseHospitalityGroup = 2; // Grupo 2 el sábado 21

    function getDayName(date) {
      const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      return days[date.getDay()];
    }

    function formatDate(date) {
      const day = String(date.getDate()).padStart(2, '0');
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const year = date.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function calculateGroup(baseDate, baseGroup, targetDate) {
      const diffTime = targetDate - baseDate;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      const meetingsPassed = Math.floor(diffDays / 3.5); // Aproximado
      const group = ((baseGroup - 1 + meetingsPassed) % 5) + 1;
      return group;
    }

    function calculateCleaningGroup(meetingDate) {
      return calculateGroup(baseDate, baseCleaningGroup, meetingDate);
    }

    function calculateHospitalityGroup(saturdayDate) {
      return calculateGroup(baseSaturday, baseHospitalityGroup, saturdayDate);
    }

    function findNextMeetingDay() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      let nextDay = new Date(today);
      
      // Buscar el próximo martes (2) o sábado (6)
      while (nextDay.getDay() !== 2 && nextDay.getDay() !== 6) {
        nextDay.setDate(nextDay.getDate() + 1);
      }
      
      return nextDay;
    }

    function isToday(date) {
      const today = new Date();
      return date.toDateString() === today.toDateString();
    }

    function updateDisplay() {
      const now = new Date();
      
      // Actualizar fecha en header
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const dateString = now.toLocaleDateString('es-ES', options);
      document.getElementById('currentDate').textContent = 
        dateString.charAt(0).toUpperCase() + dateString.slice(1);
      
      // Encontrar el próximo día de reunión (hoy si es martes o sábado)
      const nextMeetingDay = findNextMeetingDay();
      const isTodayMeeting = isToday(nextMeetingDay);
      const isSaturday = (nextMeetingDay.getDay() === 6);
      
      // Calcular grupos
      const cleaningGroup = calculateCleaningGroup(nextMeetingDay);
      const hospitalityGroup = isSaturday ? calculateHospitalityGroup(nextMeetingDay) : null;
      
      // Generar HTML
      const mainContent = document.getElementById('mainContent');
      let html = '';
      
      // Tarjeta de Grupo Limpieza
      html += `
        <div class="service-card ${isTodayMeeting ? 'today' : ''}">
          <div class="card-icon">🧹</div>
          <h2 class="card-title">Grupo Limpieza</h2>
          <div class="group-container">
            <div class="group-number">${cleaningGroup}</div>
            ${isTodayMeeting ? '<div class="today-badge">HOY</div>' : ''}
          </div>
        </div>
      `;
      
      // Tarjeta de Grupo Hospitalidad (solo sábados)
      if (isSaturday && hospitalityGroup) {
        html += `
          <div class="service-card ${isTodayMeeting ? 'today' : ''}">
            <div class="card-icon">🤝</div>
            <h2 class="card-title">Grupo Hospitalidad</h2>
            <div class="group-container">
              <div class="group-number">${hospitalityGroup}</div>
              ${isTodayMeeting ? '<div class="today-badge">HOY</div>' : ''}
            </div>
          </div>
        `;
      }
      
      mainContent.innerHTML = html;
    }

    // Modo oscuro/claro
    const body = document.getElementById('body');
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme-services');

    function setTheme(theme) {
      if (theme === 'dark') {
        body.classList.remove('dark-auto');
        body.classList.add('dark-mode');
        localStorage.setItem('theme-services', 'dark');
      } else {
        body.classList.remove('dark-mode', 'dark-auto');
        localStorage.setItem('theme-services', 'light');
      }
    }

    if (savedTheme === 'dark') setTheme('dark');
    else if (savedTheme === 'light') setTheme('light');

    themeToggle.addEventListener('click', () => {
      if (body.classList.contains('dark-mode') || body.classList.contains('dark-auto')) {
        setTheme('light');
      } else {
        setTheme('dark');
      }
    });

    // Pantalla completa
    const fullscreenToggle = document.getElementById('fullscreenToggle');
    
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          fullscreenToggle.classList.add('active');
          fullscreenToggle.innerHTML = '⛶';
        }).catch(err => {
          console.log('Error al activar pantalla completa:', err);
        });
      } else {
        document.exitFullscreen().then(() => {
          fullscreenToggle.classList.remove('active');
          fullscreenToggle.innerHTML = '⛶';
        });
      }
    }

    fullscreenToggle.addEventListener('click', toggleFullscreen);

    // También con tecla F11
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Detectar cambios de pantalla completa
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fullscreenToggle.classList.add('active');
      } else {
        fullscreenToggle.classList.remove('active');
      }
    });

    // Actualizar al cargar y cada minuto
    updateDisplay();
    setInterval(updateDisplay, 60000);
  </script>
</body>
</html>
